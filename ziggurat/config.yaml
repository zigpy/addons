---
version: 0.3.1
slug: ziggurat
name: Ziggurat Zigbee Server
description: Open source host-side Zigbee stack written in Rust
url: https://github.com/zigpy/ziggurat
homeassistant: 2026.8.0b0
arch:
  - aarch64
  - amd64
stage: experimental
init: false
startup: services
uart: true
# Boosting priority (negative nice) inside a container requires CAP_SYS_NICE
privileged:
  - SYS_NICE
options:
  device: null
  baudrate: 460800
  flow_control: hardware
  log_level: info
schema:
  device: device(subsystem=tty)
  baudrate: int
  flow_control: list(hardware|software|none)
  log_level: list(error|warn|info|debug|trace)
ports:
  9999/tcp: 9999
ports_description:
  9999/tcp: WebSocket API
image: ghcr.io/zigpy/ziggurat-addon
